<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Samra POS</title>
    <meta
      name="description"
      content="نظام نقطة البيع — إدارة المبيعات والمخزون"
    />
    <meta name="author" content="Samra" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Samra" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("samra-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#0f172a" : "#2563eb");
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />

    <meta property="og:title" content="Samra POS" />
    <meta
      property="og:description"
      content="نظام نقطة البيع — إدارة المبيعات والمخزون"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Samra POS" />
    <meta
      name="twitter:description"
      content="نظام نقطة البيع — إدارة المبيعات والمخزون"
    />
    <meta name="twitter:image" content="/pwa-512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
